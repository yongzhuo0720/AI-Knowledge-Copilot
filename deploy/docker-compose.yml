services:
  backend:
    build:
      context: ../backend
    container_name: ai-copilot-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AI_SERVICE_BASE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ../ai-service
    container_name: ai-copilot-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      AI_SERVICE_MINIO_ENDPOINT: minio:9000
      AI_SERVICE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      AI_SERVICE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_SERVICE_MINIO_BUCKET: ai-copilot
      AI_SERVICE_MILVUS_HOST: milvus
      AI_SERVICE_MILVUS_PORT: 19530
      AI_SERVICE_MYSQL_HOST: mysql
      AI_SERVICE_MYSQL_PORT: 3306
      AI_SERVICE_MYSQL_DATABASE: ${MYSQL_DATABASE}
      AI_SERVICE_MYSQL_USER: ${MYSQL_USER}
      AI_SERVICE_MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      AI_SERVICE_TASK_STORE_ENABLED: "true"
      AI_SERVICE_TASK_MAX_RETRIES: 3
      AI_SERVICE_TASK_RETRY_BACKOFF_SECONDS: 2
      AI_SERVICE_TASK_RECOVERY_INTERVAL_SECONDS: 5
      AI_SERVICE_TASK_PROCESSING_STALE_SECONDS: 300
      AI_SERVICE_CHAT_API_KEY: ${DEEPSEEK_API_KEY}
      AI_SERVICE_EMBEDDING_API_KEY: ${DASHSCOPE_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      milvus:
        condition: service_started

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: ai-copilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: ai-copilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: ai-copilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-copilot-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ai-copilot-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >-
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  milvus:
    image: milvusdb/milvus:v2.5.15
    container_name: ai-copilot-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - milvus-minio

  milvus-minio:
    image: minio/minio:latest
    container_name: ai-copilot-milvus-minio
    command: minio server /minio_data
    volumes:
      - milvus-minio-data:/minio_data

volumes:
  mysql-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:
  milvus-minio-data:
