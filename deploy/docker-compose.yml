services:
  backend:
    build:
      context: ../backend
    container_name: ai-copilot-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      # 与 ai-service 共享的内部 Token；两端必须一致，否则所有 AI 调用都会被 401。
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  ai-service:
    build:
      context: ../ai-service
    container_name: ai-copilot-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    environment:
      AI_SERVICE_MINIO_ENDPOINT: minio:9000
      AI_SERVICE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      AI_SERVICE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_SERVICE_MINIO_BUCKET: ai-copilot
      AI_SERVICE_MILVUS_HOST: milvus
      AI_SERVICE_MILVUS_PORT: 19530
      AI_SERVICE_MYSQL_HOST: mysql
      AI_SERVICE_MYSQL_PORT: 3306
      AI_SERVICE_MYSQL_DATABASE: ${MYSQL_DATABASE}
      AI_SERVICE_MYSQL_USER: ${MYSQL_USER}
      AI_SERVICE_MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      AI_SERVICE_TASK_STORE_ENABLED: "true"
      # 重试预算要覆盖「一次依赖冷启动」：指数退避 3s/6s/12s/24s/48s ≈ 93s，
      # 而 Milvus standalone 从冷启动到 healthy 实测约 60-70s。此前 3 次 × 2s（共 14s）
      # 在「daemon 刚启动就上传文档」的场景下必然把任务判 FAILED（2026-10-24 e2e 实测）。
      AI_SERVICE_TASK_MAX_RETRIES: 5
      AI_SERVICE_TASK_RETRY_BACKOFF_SECONDS: 3
      AI_SERVICE_TASK_RECOVERY_INTERVAL_SECONDS: 5
      AI_SERVICE_TASK_PROCESSING_STALE_SECONDS: 300
      AI_SERVICE_CHAT_API_KEY: ${DEEPSEEK_API_KEY}
      # Embedding 走硅基流动的免费 bge-m3（1024 维）。BAAI 系列不接受 dimensions
      # 参数，因此 AI_SERVICE_EMBEDDING_DIMENSIONS=0 表示「不发送该字段」。
      AI_SERVICE_EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      AI_SERVICE_EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      AI_SERVICE_EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      AI_SERVICE_EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      # 远端 Cross-Encoder 精排（gte-rerank-v2，独立可选密钥；未配置时走本地标识符提权）。
      # 换说法题集实测 Hit@1 41.7%→66.7%；启用前务必先在主评估集复测加法组合版
      # 不回归（见 docs/检索效果评估报告.md 第十三节），再把下面三行注释打开。
      # AI_SERVICE_RERANK_PROVIDER: dashscope
      # AI_SERVICE_RERANK_API_KEY: ${DASHSCOPE_API_KEY}
      # AI_SERVICE_RERANK_MODEL: gte-rerank-v2
      # 健康检查接口不校验 Token，其余接口必须带 X-Internal-Token。
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: ai-copilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: ai-copilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: ai-copilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # 镜像从官方 Release 二进制自建（见 minio/Dockerfile 顶部说明）
    build:
      context: ./minio
    image: ai-copilot-minio-server
    container_name: ai-copilot-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      # 自建镜像里没有 mc，用 MinIO 自带的存活端点探活（alpine 自带 wget）
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - minio-data:/data

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: ai-copilot-etcd
    # 与其他服务一致的自启策略：Docker daemon 重启后 etcd 必须自己回来，
    # 否则 milvus 连不上元数据服务会陷入崩溃循环（2026-10-24 实测复现）。
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >-
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  milvus:
    image: milvusdb/milvus:v2.5.15
    container_name: ai-copilot-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9091/healthz"]
      # Milvus standalone 冷启动实测 60-90s（慢磁盘上更久）；start_period 内的
      # 失败不计入 retries，避免「刚启动就被判死 → restart → 再判死」的循环。
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 18

  milvus-minio:
    # 与 minio 共用同一份自建镜像。注意 command 不带 "minio" 前缀：
    # 自建镜像的 ENTRYPOINT 就是二进制本身（官方镜像是入口脚本，写法不同）
    build:
      context: ./minio
    image: ai-copilot-minio-server
    container_name: ai-copilot-milvus-minio
    # 同上：milvus 的对象存储依赖，daemon 重启后必须自启。
    restart: unless-stopped
    command: server /minio_data
    volumes:
      - milvus-minio-data:/minio_data

volumes:
  mysql-data:
  redis-data:
  minio-data:
  etcd-data:
  milvus-data:
  milvus-minio-data:
