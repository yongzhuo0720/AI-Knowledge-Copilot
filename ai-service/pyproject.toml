[project]
name = "ai-knowledge-copilot-ai-service"
version = "0.0.1"
description = "AI service for document processing, retrieval and agent orchestration"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
    "minio>=7.2,<8.0",
    "pypdf>=5.0,<6.0",
    "python-docx>=1.1,<2.0",
    "pymilvus>=2.5,<3.0",
    "pymysql>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "httpx>=0.28,<1.0",
]
# 可选：更精细的中文分词（带 18MB 词典，且只发布源码包、安装时要本地构建）。
# 不装也能跑 —— BM25 会退化成 bigram 分词，见 app/hybrid_search.py 的说明。
quality = [
    "jieba>=0.42,<1.0",
]
