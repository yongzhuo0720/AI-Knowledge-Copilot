[project]
name = "ai-knowledge-copilot-ai-service"
version = "0.0.1"
description = "AI service for document processing, retrieval and agent orchestration"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "httpx>=0.28,<1.0",
]
