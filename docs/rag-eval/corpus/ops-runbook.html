  <h1>现场运维值班手册</h1>
  <p>本手册供值班工程师在交接班与突发故障时查阅。</p>

  <h2>交接班流程</h2>
  <p>夜间交接班必须在 22:30 之前完成设备清单核对，并在值班日志上双方签字。</p>
  <p>交接内容包括在线设备数量、未闭环工单、以及待处理的固件升级任务。</p>

  <h2>应急联系方式</h2>
  <p>值班应急电话为 4008-517-208，转 3 号键进入二线支持。</p>

  <h2>升级窗口</h2>
  <p>除紧急修复外，固件升级只允许在每周三凌晨 1:00 到 4:00 之间执行。</p>
